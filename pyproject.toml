[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meok-eu-platform-worker-mcp"
version = "1.0.0"
description = "EU Platform Workers Directive (2024/2831) compliance — employment-status presumption, algorithmic-management disclosure, human oversight of significant decisions, worker data protection, member-state transposition tracking, misclassification-risk forecast. Targets EU gig-economy platforms (€20bn market). Transposition deadline 2 Dec 2026. By MEOK AI Labs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Nicholas Templeman", email = "nicholas@meok.ai" }]
keywords = ["mcp", "eu-platform-workers", "directive-2024-2831", "ley-rider", "algorithmic-management", "gig-economy", "platform-workers", "deliveroo", "uber", "bolt", "wolt", "glovo", "free-now", "just-eat", "meok"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
]
dependencies = ["mcp[cli]>=1.3.0"]

[project.urls]
Homepage = "https://haulage.app"
Repository = "https://github.com/CSOAI-ORG/meok-eu-platform-worker-mcp"

[project.scripts]
meok-eu-platform-worker-mcp = "server:main"

[tool.setuptools]
py-modules = ["server"]
